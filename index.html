```html
<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <title>
        Мониторинг Tah-O
    </title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body style="
    font-family:sans-serif;
    margin:0;
    padding:10px;
">

<h2>СМЭВ / Активизации</h2>

<h3 id="status">
    Загрузка...
</h3>

<div id="stats" style="
    margin-top:20px;
"></div>

<div style="
    position:relative;
    height:35vh;
    width:100%;
">
    <canvas id="chart"></canvas>
</div>

<h3 style="
    margin-top:30px;
">
    Активность пользователей Tah-O
</h3>

<div style="
    position:relative;
    height:25vh;
    width:100%;
">
    <canvas id="usersChart"></canvas>
</div>

<script>

let chart;
let usersChart;

function getColor(value) {

    if (value > 60) return 'red';
    if (value > 30) return 'orange';

    return 'green';
}

function localTime(str) {

    if (!str || str === '-') {
        return '-';
    }

    const d = new Date(str);

    if (isNaN(d.getTime())) {
        return str;
    }

    return d.toLocaleString([], {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
    });
}

async function loadStats() {

    try {

        const res = await fetch('/stats');
        const s = await res.json();

        const dataRes = await fetch('/data');
        const data = await dataRes.json();

        const lastUsers =
            data.length
                ? (data[data.length - 1].users || 0)
                : 0;

        const lastUsersAvg =
            data.length
                ? (data[data.length - 1].users_avg || 0)
                : 0;

        document.getElementById('stats').innerHTML = `

            <div style="
                display:flex;
                gap:40px;
                flex-wrap:wrap;
                margin-top:10px;
            ">

                <div>

                    <b>СМЭВ</b><br>

                    Средний:
                    ${s.avg_smev} мин<br>

                    Макс:
                    ${s.max_smev} мин

                </div>

                <div>

                    <b>Активации</b><br>

                    Средний:
                    ${s.avg_act} мин<br>

                    Макс:
                    ${s.max_act} мин

                </div>

                <div>

                    <b>Пользователи</b><br>

                    Сейчас:
                    ${lastUsers} / ${lastUsersAvg}<br><br>

                    Рекорд суток:<br>

                    ${s.day_record?.users || 0}
                    (
                    ${localTime(
                        s.day_record?.time
                    )}
                    )<br><br>

                    Рекорд за всё время:<br>

                    ${s.all_time_record?.users || 0}
                    (
                    ${localTime(
                        s.all_time_record?.time
                    )}
                    )

                </div>

            </div>
        `;

    } catch(e) {

        console.log(
            "STATS ERROR",
            e
        );
    }
}

async function load() {

    try {

        const res = await fetch('/data');
        const data = await res.json();

        if (!data || data.length === 0) {
            return;
        }

        const labels = data.map(x => {

            const d = new Date(x.time);

            return d.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        });

        const smev = data.map(x => x.smev);
        const act = data.map(x => x.act);
        const queue = data.map(x => x.queue || 0);

        const last = data[data.length - 1];

        const statusEl =
            document.getElementById(
                "status"
            );

        if (statusEl && last) {

            statusEl.innerText =
                `Статус: ${last.status}
                | СМЭВ: ${last.smev} мин`;

            statusEl.style.color =
                getColor(last.smev);
        }

        if (chart) {

            chart.data.labels = labels;

            chart.data.datasets[0].data = smev;
            chart.data.datasets[1].data = act;
            chart.data.datasets[2].data = queue;

            chart.update();

            return;
        }

        chart = new Chart(
            document.getElementById('chart'),
            {
                type: 'line',

                data: {

                    labels: labels,

                    datasets: [

                        {
                            label: 'СМЭВ',
                            data: smev,
                            borderColor: 'red',
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Активации',
                            data: act,
                            borderColor: 'blue',
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Очередь',
                            data: queue,
                            borderColor: 'purple',
                            borderWidth: 2,
                            tension: 0.2
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false
                }
            }
        );

    } catch(e) {

        console.log(
            "LOAD ERROR",
            e
        );
    }
}

async function loadUsersGraph() {

    try {

        const res = await fetch('/data');
        const data = await res.json();

        const labels = data.map(x => {

            const d = new Date(x.time);

            return d.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        });

        const users =
            data.map(
                x => x.users || 0
            );

        const usersAvg =
            data.map(
                x => x.users_avg || 0
            );

        if (usersChart) {

            usersChart.data.labels = labels;

            usersChart.data.datasets[0].data =
                users;

            usersChart.data.datasets[1].data =
                usersAvg;

            usersChart.update();

            return;
        }

        usersChart = new Chart(
            document.getElementById(
                'usersChart'
            ),
            {
                type: 'line',

                data: {

                    labels: labels,

                    datasets: [

                        {
                            label: 'Текущая активность',
                            data: users,
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Средняя активность',
                            data: usersAvg,
                            borderDash: [5,5],
                            borderWidth: 2,
                            tension: 0.2
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false
                }
            }
        );

    } catch(e) {

        console.log(
            "USERS GRAPH ERROR",
            e
        );
    }
}

setInterval(load, 10000);
setInterval(loadStats, 10000);
setInterval(loadUsersGraph, 10000);

load();
loadStats();
loadUsersGraph();

</script>

</body>
</html>
```
