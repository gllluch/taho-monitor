<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мониторинг СМЭВ</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="
    font-family:sans-serif;
    margin:20px;
">

<h2>СМЭВ / Активизации</h2>

<h3 id="status">Загрузка...</h3>

<div id="stats" style="
    margin-top:20px;
"></div>

<div id="raw" style="
    margin-top:20px;
    padding:12px;
    background:#f5f5f5;
    border-radius:8px;
    font-size:14px;
"></div>

<div style="
    position: relative;
    height: 55vh;
    width: 100%;
">
    <canvas id="chart"></canvas>
</div>
<h3 style="margin-top:30px;">
    Активность пользователей Tah-O
</h3>

<div style="
    position: relative;
    height: 25vh;
    width: 100%;
">
    <canvas id="usersChart"></canvas>
</div>    
<!-- visits -->
<div id="visits" style="
    position:fixed;
    bottom:5px;
    right:10px;
    font-size:11px;
    color:#999;
">
    visits: ...
</div>

<script>

let chart;
let usersChart;
    
function getColor(value) {
    if (value > 60) return 'red';
    if (value > 30) return 'orange';

    return 'green';
}


// ---------------- STATS ----------------
async function loadStats() {
    try {

        const res = await fetch('/stats');
        const s = await res.json();
        const dataRes = await fetch('/data');
        const data = await dataRes.json();

        const lastUsers =
            const lastUsersAvg =
                data.length
                    ? (data[data.length - 1].users_avg || 0)
                    : 0;
            data.length
                ? (data[data.length - 1].users || 0)
                : 0;

        document.getElementById('stats').innerHTML = `
            <div style="
                display:flex;
                gap:40px;
                margin-top:10px;
            ">

                <div>
                    <b>СМЭВ</b><br>
                    Средний: ${s.avg_smev} мин<br>
                    Макс: ${s.max_smev} мин
                </div>

                <div>
                    <b>Активации</b><br>
                    Средний: ${s.avg_act} мин<br>
                    Макс: ${s.max_act} мин
                </div>
                    <div>
                    <b>Пользователи</b><br>
                    Сейчас: ${lastUsers} / ${lastUsersAvg} 
                    Рекорд: ${s.max_users}
                </div>
            </div>
        `;

    } catch(e) {
        console.log("STATS ERROR", e);
    }
}


// ---------------- RAW ----------------
async function loadRaw() {

    try {

        const res = await fetch('/raw');
        const r = await res.json();

        function convertTime(str) {

            if (!str || str === "нет данных") {
                return str;
            }

            // "2026-04-12 15:40:00"
            const iso = str.replace(' ', 'T') + '+03:00';

            const d = new Date(iso);

            if (isNaN(d.getTime())) {
                return str;
            }

            return d.toLocaleString([], {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        document.getElementById('raw').innerHTML = `
            <b>Данные источника:</b><br><br>

            Последняя активизация:<br>
            ${convertTime(r.activation)}<br><br>

            Последний ответ СМЭВ:<br>
            ${convertTime(r.smev)}
        `;

    } catch(e) {
        console.log("RAW ERROR", e);
    }
}

// ---------------- MAIN GRAPH ----------------
async function load() {

    try {

        const res = await fetch('/data');
        const data = await res.json();

        if (!data || data.length === 0) return;

        const labels = data.map(x => {

    // старый формат HH:MM
    if (typeof x.time === 'string' && x.time.length <= 5) {
        return x.time;
    }

    // новый ISO формат
    const d = new Date(x.time);

    if (isNaN(d.getTime())) {
        return "??";
    }

    return d.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });
});

   
        const smev = data.map(x => x.smev);
        const act = data.map(x => x.act);

        const last = data[data.length - 1];

        const statusEl = document.getElementById("status");

        if (statusEl && last) {

            statusEl.innerText =
                `Статус: ${last.status} | СМЭВ: ${last.smev} мин`;

            statusEl.style.color = getColor(last.smev);
        }

        if (chart) {

            chart.data.labels = labels;
            chart.data.datasets[0].data = smev;
            chart.data.datasets[1].data = act;

            chart.update();

            return;
        }

        chart = new Chart(
            document.getElementById('chart'),
            {
                type: 'line',

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label: 'СМЭВ (мин)',
                            data: smev,
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Активации (мин)',
                            data: act,
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Критический уровень (60 мин)',
                            data: labels.map(() => 60),
                            borderDash: [5,5],
                            borderWidth: 1,
                            pointRadius: 0
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    

                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Задержка (минуты)'
                            }
                        },

                        x: {
                            title: {
                                display: true,
                                text: 'Время'
                            }
                        }
                    }
                }
            }
        );

    } catch(e) {
        console.log("LOAD ERROR", e);
    }
}

//-----------------Users GRAPH---------------
    async function loadUsersGraph() {

    try {

        const res = await fetch('/data');
        const data = await res.json();

        const labels = data.map(x => {

            if (typeof x.time === 'string' && x.time.length <= 5) {
                return x.time;
            }

            const d = new Date(x.time);

            return d.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });

        });

        const users = data.map(x => x.users || 0);

        if (usersChart) {

            usersChart.data.labels = labels;
            usersChart.data.datasets[0].data = users;

            usersChart.update();

            return;
        }

        usersChart = new Chart(
            document.getElementById('usersChart'),
            {
                type: 'line',

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label: 'Активность пользователей',
                            data: users,
                            borderWidth: 2,
                            tension: 0.2
                        }
                    ]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false
                }
            }
        );

    } catch(e) {
        console.log("USERS GRAPH ERROR", e);
    }
}
// ---------------- VISITS ----------------
async function loadVisits() {

    try {

        const res = await fetch('/visits');
        const data = await res.json();

        document.getElementById('visits').innerText =
            "visits: " + data.visits;

    } catch {}
}


// ---------------- AUTO UPDATE ----------------
setInterval(load, 10000);
setInterval(loadStats, 30000);
setInterval(loadRaw, 10000);
setInterval(loadUsersGraph, 10000);

loadUsersGraph();
load();
loadStats();
loadRaw();
loadVisits();

</script>
