<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мониторинг СМЭВ</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="
    font-family:sans-serif;
    margin:20px;
">

<h2>СМЭВ / Активизации</h2>

<h3 id="status">Загрузка...</h3>

<div id="stats" style="
    margin-top:20px;
"></div>

<div id="raw" style="
    margin-top:20px;
    padding:12px;
    background:#f5f5f5;
    border-radius:8px;
    font-size:14px;
"></div>

<canvas id="chart"></canvas>

<!-- visits -->
<div id="visits" style="
    position:fixed;
    bottom:5px;
    right:10px;
    font-size:11px;
    color:#999;
">
    visits: ...
</div>

<script>

let chart;

function getColor(value) {
    if (value > 60) return 'red';
    if (value > 30) return 'orange';

    return 'green';
}


// ---------------- STATS ----------------
async function loadStats() {
    try {

        const res = await fetch('/stats');
        const s = await res.json();

        document.getElementById('stats').innerHTML = `
            <div style="
                display:flex;
                gap:40px;
                margin-top:10px;
            ">

                <div>
                    <b>СМЭВ</b><br>
                    Средний: ${s.avg_smev} мин<br>
                    Макс: ${s.max_smev} мин
                </div>

                <div>
                    <b>Активации</b><br>
                    Средний: ${s.avg_act} мин<br>
                    Макс: ${s.max_act} мин
                </div>

            </div>
        `;

    } catch(e) {
        console.log("STATS ERROR", e);
    }
}


// ---------------- RAW ----------------
async function loadRaw() {
    try {

        const res = await fetch('/raw');
        const r = await res.json();

        document.getElementById('raw').innerHTML = `
            <b>Данные источника:</b><br><br>

            Последняя активизация:
            ${r.activation}<br><br>

            Последний ответ СМЭВ:
            ${r.smev}
        `;

    } catch(e) {
        console.log("RAW ERROR", e);
    }
}


// ---------------- MAIN GRAPH ----------------
async function load() {

    try {

        const res = await fetch('/data');
        const data = await res.json();

        if (!data || data.length === 0) return;

        const labels = data.map(x => {
            const d = new Date(x.time);

   
        const smev = data.map(x => x.smev);
        const act = data.map(x => x.act);

        const last = data[data.length - 1];

        const statusEl = document.getElementById("status");

        if (statusEl && last) {

            statusEl.innerText =
                `Статус: ${last.status} | СМЭВ: ${last.smev} мин`;

            statusEl.style.color = getColor(last.smev);
        }

        if (chart) {

            chart.data.labels = labels;
            chart.data.datasets[0].data = smev;
            chart.data.datasets[1].data = act;

            chart.update();

            return;
        }

        chart = new Chart(
            document.getElementById('chart'),
            {
                type: 'line',

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label: 'СМЭВ (мин)',
                            data: smev,
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Активации (мин)',
                            data: act,
                            borderWidth: 2,
                            tension: 0.2
                        },

                        {
                            label: 'Критический уровень (60 мин)',
                            data: labels.map(() => 60),
                            borderDash: [5,5],
                            borderWidth: 1,
                            pointRadius: 0
                        }
                    ]
                },

                options: {
                    responsive: true,
                    animation: false,

                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Задержка (минуты)'
                            }
                        },

                        x: {
                            title: {
                                display: true,
                                text: 'Время'
                            }
                        }
                    }
                }
            }
        );

    } catch(e) {
        console.log("LOAD ERROR", e);
    }
}


// ---------------- VISITS ----------------
async function loadVisits() {

    try {

        const res = await fetch('/visits');
        const data = await res.json();

        document.getElementById('visits').innerText =
            "visits: " + data.visits;

    } catch {}
}


// ---------------- AUTO UPDATE ----------------
setInterval(load, 10000);
setInterval(loadStats, 30000);
setInterval(loadRaw, 10000);

load();
loadStats();
loadRaw();
loadVisits();

</script>

<div style="
    margin-top:30px;
    text-align:center;
    font-size:12px;
    color:#777;
">

            width="16"
            style="
                margin-top:5px;
                opacity:0.7;
            "
        >

    </a>

</div>

</body>
</html>
