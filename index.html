<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мониторинг СМЭВ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: sans-serif;">

<h2>СМЭВ / Активизации</h2>

<h3 id="status">Загрузка...</h3>
<div id="stats" style="margin-top:20px;"></div>
<canvas id="chart"></canvas>

<!-- счетчик -->
<div id="visits" style="
    position: fixed;
    bottom: 5px;
    right: 10px;
    font-size: 11px;
    color: #999;
">
    visits: ...
</div>

<script>
let chart;

function getColor(value) {
    if (value > 60) return 'red';
    if (value > 30) return 'orange';
    return 'green';
}

async function load() {
    try {
        const res = await fetch('/data');
        const data = await res.json();

        if (!data || data.length === 0) return;

        const labels = data.map(x => x.time);
        const smev = data.map(x => x.smev);
        const act = data.map(x => x.act);

        const last = data[data.length - 1];

        // статус
        const statusEl = document.getElementById("status");
        if (statusEl && last) {
            statusEl.innerText =
                `Статус: ${last.status} | СМЭВ: ${last.smev} мин`;

            statusEl.style.color = getColor(last.smev);
        }

        if (chart) {
            chart.data.labels = labels;
            chart.data.datasets[0].data = smev;
            chart.data.datasets[1].data = act;
            chart.update();
            return;
        }

        chart = new Chart(document.getElementById('chart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'СМЭВ (мин)',
                        data: smev,
                        borderColor: 'red',
                        borderWidth: 2,
                        tension: 0.2
                    },
                    {
                        label: 'Активации (мин)',
                        data: act,
                        borderColor: 'blue',
                        borderWidth: 2,
                        tension: 0.2
                    },
                    {
                        label: 'Критический уровень (60 мин)',
                        data: labels.map(() => 60),
                        borderColor: 'black',
                        borderDash: [5,5],
                        borderWidth: 1,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.raw + ' мин';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        title: {
                            display: true,
                            text: 'Задержка (минуты)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Время'
                        }
                    }
                }
            }
        });

    } catch (e) {
        console.error("Ошибка загрузки:", e);
    }
}
//Статистика

document.getElementById('stats').innerHTML = `
<div style="display:flex; gap:40px; margin-top:10px;">

    <div>
        <b>СМЭВ</b><br>
        Средний: ${s.avg_smev} мин<br>
        Макс: ${s.max_smev} мин
    </div>

    <div>
        <b>Активации</b><br>
        Средний: ${s.avg_act} мин<br>
        Макс: ${s.max_act} мин
    </div>

</div>
`;
}

// счетчик посещений
async function loadVisits() {
    try {
        const res = await fetch('/visits');
        const data = await res.json();

        document.getElementById('visits').innerText =
            "visits: " + data.visits;
    } catch {}
}

// автообновление
setInterval(load, 10000);
load();
loadVisits();
loadStats();
</script>

<!-- footer -->
<div style="
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: #777;
">

             width="16"
             style="margin-top:5px; opacity:0.7;">
    </a>
</div>

</body>
</html>
